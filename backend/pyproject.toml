[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette nudges towards httpx2 for TestClient; httpx still works.
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
