name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wind-desk .
      - name: Smoke test
        shell: bash
        run: |
          docker run -d --name wind-desk -e PORT=5000 -p 8000:5000 wind-desk
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 1; done
          curl -fs http://localhost:8000/api/health
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          curl -fs -o /dev/null "http://localhost:8000/api/decision?date=2026-01-15&cutoff=09:20"
          curl -fs -o /dev/null "http://localhost:8000/api/accuracy?start=2026-01-02&end=2026-02-01&cutoff=09:20"
      - name: Container logs
        if: always()
        run: docker logs wind-desk || true
